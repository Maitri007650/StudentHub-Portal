<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/style.css">

    <title>StudentHub Portal - Events</title>
</head>

<body>

    <header>
        <h1>College Events</h1>
        <p>Explore upcoming student and college events.</p>
    </header>


    <button id="menuToggle" type="button" aria-expanded="false">
        ☰ Menu
    </button>

    <nav>

        <a href="home.html">Home</a>
        <a href="about.html">About</a>
        <a href="register.html">Register</a>
        <a href="login.html">Login</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="events.html">Events</a>
        <a href="profile.html">Profile</a>
        <a href="contact.html">Contact</a>
        <a href="admin.html">Admin</a>
        <a href="faq.html">FAQ</a>
        <a href="timetable.html">Timetable</a>

        <button id="themeToggle" type="button">Dark Mode</button>

    </nav>


    <main>

        <section>

            <h2>Upcoming Events</h2>

            <label for="eventSearch">Search Events:</label>
        <input type="text" id="eventSearch" placeholder="Search events">

        <label for="eventFilter">Filter by Category:</label>
        <select id="eventFilter">
            <option value="All">All Categories</option>
            <option value="Academic">Academic</option>
            <option value="Technology">Technology</option>
            <option value="Sports">Sports</option>
            <option value="Cultural">Cultural</option>
        </select>

        <label for="eventSort">Sort Events:</label>
        <select id="eventSort">
            <option value="date">Date</option>
            <option value="name">Event Name</option>
        </select>

        <p id="eventLoading">Loading events...</p>
        <p id="eventError"></p>

        <table>

            <caption>Upcoming College Events</caption>

            <thead>
                <tr>
                    <th>Event</th>
                    <th>Date</th>
                    <th>Category</th>
                </tr>
            </thead>

            <tbody id="eventsTableBody">
            </tbody>

        </table>

        <div id="eventPagination">

            <button id="previousPage" type="button">
                Previous
            </button>

            <span id="pageNumber">Page 1</span>

            <button id="nextPage" type="button">
                Next
            </button>

        </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 StudentHub Portal. All rights reserved.</p>
    </footer>
    <script src="../js/script.js"></script>
</body>

</html>
