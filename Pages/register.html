<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/style.css">

    <title>StudentHub Portal - Register</title>
</head>

<body>

    <header>
        <h1>StudentHub Portal</h1>
        <p>Create your StudentHub account.</p>
    </header>

    <button id="menuToggle" type="button" aria-expanded="false">
        ☰ Menu
    </button>

    <nav>

        <a href="home.html">Home</a>
        <a href="about.html">About</a>
        <a href="register.html">Register</a>
        <a href="login.html">Login</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="events.html">Events</a>
        <a href="profile.html">Profile</a>
        <a href="contact.html">Contact</a>
        <a href="admin.html">Admin</a>
        <a href="faq.html">FAQ</a>
        <a href="timetable.html">Timetable</a>

        <button id="themeToggle" type="button">Dark Mode</button>

    </nav>


    <main>

        <section class="register-section">

            <h2>Student Registration</h2>

            <form id="registrationForm" action="#" method="post" novalidate>
                

                <fieldset>

                    <legend>Registration Details</legend>

                    <p>
                        <label for="name">Full Name:</label><br>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            pattern="[A-Za-z ]{2,50}"
                            title="Name should contain only letters and spaces"
                            placeholder="Enter your full name"
                            required>
                        <span id="nameError"></span>
                        
                    </p>

                    <p>
                        <label for="email">Email:</label><br>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required>
                        <span id="emailError"></span>
                    </p>

                    <p>
                        <label for="mobile">Mobile Number:</label><br>
                        <input
                            type="tel"
                            id="mobile"
                            name="mobile"
                            pattern="[0-9]{10}"
                            title="Enter a valid 10-digit mobile number"
                            placeholder="Enter 10-digit mobile number"
                            required>
                        <span id="mobileError"></span>
                    </p>

                    <p>
                        <label for="password">Password:</label><br>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}"
                            title="Password must contain at least 8 characters, including uppercase, lowercase, number and special character"
                            placeholder="Create a password"
                            required>
                        <span id="passwordError"></span>
                        <span id="passwordStrength"></span>
                    </p>

                    <p>
                        <label for="confirmPassword">Confirm Password:</label><br>
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            required>
                        <span id="confirmPasswordError"></span>
                    </p>

                    <p>
                        <input
                            type="checkbox"
                            id="showPassword"
                            name="showPassword">
                        <label for="showPassword">Show Password</label>
                    </p>

                    <p>
                        <label for="course">Course:</label><br>
                        <input
                            type="text"
                            id="course"
                            name="course"
                            pattern="[A-Za-z ]{2,50}"
                            title="Course should contain only letters and spaces"
                            placeholder="Enter your course"
                            required>
                        <span id="courseError"></span>
                    </p>

                    <p>
                        <label for="year">Year:</label><br>
                        <select id="year" name="year" required>
                            <option value="">Select Year</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                        </select>
                        <span id="yearError"></span>
                    </p>

                    <p>
                        <label>Gender:</label><br>

                        <input
                            type="radio"
                            id="male"
                            name="gender"
                            value="Male"
                            required>
                        <label for="male">Male</label>

                        <input
                            type="radio"
                            id="female"
                            name="gender"
                            value="Female">
                        <label for="female">Female</label>

                        <input
                            type="radio"
                            id="other"
                            name="gender"
                            value="Other">
                        <label for="other">Other</label>

                        <span id="genderError"></span>
                    </p>

                    <p>
                        <input
                            type="checkbox"
                            id="terms"
                            name="terms"
                            required>
                        <label for="terms">I accept the terms and conditions.</label>
                        <span id="termsError"></span>
                    </p>

                    <p>
                        <button type="submit">Register</button>
                        <button type="reset">Clear</button>
                    </p>

                    <p id="successMessage"></p>

                </fieldset>

            </form>

            <p>
                Already have an account?
                <a href="login.html">Login here</a>
            </p>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 StudentHub Portal. All rights reserved.</p>
    </footer>
    <script src="../js/script.js"></script>
</body>

</html>
